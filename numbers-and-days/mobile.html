}
function restartRound(shuffled) { ended = false; flipped = false; position = 0; roundSize = order.length; if (shuffled) shuffle(); else render(true); }
function shuffle() { if (!order.length) return; ended = false; roundSize = order.length; for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } position = 0; flipped = false; render(true); }

// tap to flip; drag the card: left = next, right = previous (card follows the finger, flies off, next one slides in)
const card = el('card');
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let sx = 0, sy = 0, st = 0, dx = 0, swiped = false, dragging = false, busy = false, gesture = '';
const canMove = by => order.length && !ended && position + by >= 0;
function setPose(x, ease) {
  card.style.transition = ease || 'none';
  card.style.translate = x ? `${x}px 0` : '';
  card.style.rotate = x ? `${x / 18}deg` : '';
}
function clearPose() { card.style.transition = card.style.translate = card.style.rotate = card.style.opacity = ''; card.classList.remove('dragging', 'sliding'); }
// fly the current card out (dir -1 = left/next, +1 = right/previous), switch, slide the new one in
function animMove(by) {
  if (busy) return;
  if (!canMove(by)) { if (by < 0 && order.length && !ended) bounce(); return; }
  if (reduced()) { clearPose(); move(by); return; }
  busy = true;
  const dir = by > 0 ? -1 : 1, w = el('wrap').clientWidth;
  card.classList.add('sliding');
  setPose(dir * (w + 120), 'translate .22s cubic-bezier(.4,0,1,1), rotate .22s cubic-bezier(.4,0,1,1), opacity .22s');
  card.style.rotate = `${dir * 16}deg`; card.style.opacity = '0.4';
  setTimeout(() => {
    setPose(-dir * w * 0.55); card.style.rotate = `${-dir * 6}deg`; card.style.opacity = '0';
    move(by);                       // renders the new card (unflipped, no flip animation since transition is off)
    void card.offsetWidth;
    setPose(0, 'translate .3s cubic-bezier(.2,.8,.2,1), rotate .3s cubic-bezier(.2,.8,.2,1), opacity .2s');
    card.style.opacity = '1';
    setTimeout(() => { clearPose(); busy = false; }, 320);
  }, 220);
}
function bounce() {
  if (reduced() || busy) return;
  busy = true;
  setPose(28, 'translate .12s ease-out, rotate .12s ease-out');
  setTimeout(() => { setPose(0, 'translate .35s cubic-bezier(.3,1.6,.5,1), rotate .35s cubic-bezier(.3,1.6,.5,1)'); setTimeout(() => { clearPose(); busy = false; }, 360); }, 120);
}
el('wrap').addEventListener('touchstart', e => {
  if (busy || e.touches.length > 1) return;
  const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); dx = 0; swiped = false; dragging = false; gesture = '';
}, { passive: true });
el('wrap').addEventListener('touchmove', e => {
  if (busy || gesture === 'v' || e.target.closest('[data-say]')) return;
  const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
  if (!gesture) {
    if (Math.abs(mx) < 8 && Math.abs(my) < 8) return;
    gesture = Math.abs(mx) > Math.abs(my) && !hasSel() && order.length && !ended ? 'h' : 'v';
    if (gesture === 'v') return;
    dragging = true; card.classList.add('dragging');
  }
  dx = mx;
  // rubber-band when there is no previous card
  const x = dx > 0 && !canMove(-1) ? dx * 0.25 : dx;
  setPose(x);
}, { passive: true });
function endDrag() {
  if (!dragging) return;
  dragging = false; swiped = true; card.classList.remove('dragging');
  const v = Math.abs(dx) / Math.max(Date.now() - st, 1), w = el('wrap').clientWidth;
  const by = dx < 0 ? 1 : -1;
  if ((Math.abs(dx) > Math.min(100, w * 0.28) || (v > 0.45 && Math.abs(dx) > 30)) && canMove(by)) {
    // continue from where the finger left it
    animMove(by);
  } else {
    setPose(0, 'translate .3s cubic-bezier(.3,1.4,.5,1), rotate .3s cubic-bezier(.3,1.4,.5,1)');
    setTimeout(() => { if (!dragging && !busy) clearPose(); }, 320);
  }
}
el('wrap').addEventListener('touchend', endDrag);
el('wrap').addEventListener('touchcancel', endDrag);
// flip only on a plain click/tap: not when selecting text (drag, double-click, long-press) or clearing a selection
const hasSel = () => String(window.getSelection ? getSelection() : '').trim() !== '';
let selAtDown = false, flipTimer = null;
el('card').addEventListener('pointerdown', () => { selAtDown = hasSel(); });
function cardClick(e) {
  clearTimeout(flipTimer);
  if (e.detail > 1 || selAtDown || hasSel()) return;
  // with a mouse, wait a moment so a double-click (word select) cancels the flip
  const wait = matchMedia('(hover: hover) and (pointer: fine)').matches ? 250 : 0;
  flipTimer = setTimeout(() => { if (!hasSel()) flip(); }, wait);
}
el('card').addEventListener('click', e => { if (swiped) { swiped = false; return; } if (e.target.closest('[data-say]')) return; cardClick(e); });
document.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); play(); }));
el('flip').addEventListener('click', flip);
el('prev').addEventListener('click', () => animMove(-1)); el('next').addEventListener('click', () => animMove(1));
el('know').addEventListener('click', know);
const resetKnown = () => { inSection().forEach(i => { known.delete(i); Sync.setKnown(DECK, keyOf(i), false); }); chips(); build(); };
el('reset').addEventListener('click', () => { if (confirm('Mark all cards in this section as not known?')) resetKnown(); });
el('restart').addEventListener('click', resetKnown);
el('shuffle').addEventListener('click', shuffle);
el('again').addEventListener('click', () => restartRound(false));
el('again-shuffle').addEventListener('click', () => restartRound(true));
el('back-last').addEventListener('click', () => { ended = false; position = order.length - 1; flipped = false; render(true); });
el('direction').addEventListener('click', () => { reverse = !reverse; el('direction').textContent = reverse ? 'Portuguese → English' : 'English → Portuguese'; flipped = false; render(true); });
el('autoplay').addEventListener('click', () => { autoplay = !autoplay; el('autoplay').textContent = `Auto-play: ${autoplay ? 'on' : 'off'}`; el('autoplay').setAttribute('aria-pressed', String(autoplay)); });
// iPad with keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.target.tagName === 'BUTTON' && e.code === 'Space') return;
  if (ended && (e.key === 'Enter' || e.code === 'Space')) { e.preventDefault(); restartRound(false); return; }
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') animMove(1);
  else if (e.key === 'ArrowLeft') animMove(-1);
  else if (e.key.toLowerCase() === 'q') play();
  else if (e.key.toLowerCase() === 'k') know();
});

function syncRefresh() {
  const before = known; loadKnown();
  const wasEmpty = !order.length, current = order[position];
  order = order.filter(i => !known.has(i));
  const back = [...before].filter(i => !known.has(i) && (!section || cards[i].s === section));
  if (wasEmpty && back.length) { chips(); build(); return; }
  order.push(...back);
  const p = order.indexOf(current);
  if (p >= 0) position = p; else { position = Math.min(position, Math.max(order.length - 1, 0)); flipped = false; }
  chips(); render(false, true);
}
Sync.onChange(syncRefresh);
Sync.onStatus(t => { el('sync-btn').textContent = '☁︎ ' + t; });
el('sync-btn').addEventListener('click', () => Sync.openSettings());
chips(); build();
</script>
<!-- wordpop: select a word/phrase on a card -> popup with pronunciation (pt-PT voice) and translation.
     Injected before </body> of every flashcard page (episode template, site templates). Needs global `cards`. -->
<style>
  #wordpop { position:fixed; z-index:50; display:none; max-width:min(340px,calc(100vw - 24px)); padding:10px 12px; border:1px solid #dce5df; border-radius:14px; background:#fff; color:#172b2a; box-shadow:0 14px 40px #193d3229; font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; text-align:left; user-select:none; -webkit-user-select:none; }
  #wordpop .wp-row { display:flex; align-items:center; gap:10px; }
  #wordpop .wp-say { flex:none; min-height:38px; min-width:38px; padding:0 10px; border:1px solid #0c6958; border-radius:10px; background:#0c6958; color:#fff; font-size:1.05rem; cursor:pointer; }
  #wordpop .wp-text { font-weight:700; overflow-wrap:anywhere; }
  #wordpop .wp-tr { margin-top:6px; color:#172b2a; overflow-wrap:anywhere; }
  #wordpop .wp-src { margin-top:4px; color:#61716e; font-size:.78rem; }
  #wordpop .wp-src a { color:#0c6958; line-height:1.9; }
</style>
<div id="wordpop" role="dialog" aria-label="Selected word">
  <div class="wp-row"><button class="wp-say" type="button" aria-label="Listen">🔊</button><span class="wp-text"></span></div>
  <div class="wp-tr"></div>
  <div class="wp-src"></div>
</div>
<script>
(function () {
  const pop = document.getElementById('wordpop');
  const $ = s => pop.querySelector(s);
  const cache = new Map();
  let current = null, timer = null, reqId = 0;

  // ---- glossary from this deck's cards ----
  const norm = s => String(s).toLowerCase().replace(/^[^:]{1,20}:\s+/, '').replace(/\([^)]*\)/g, ' ')
    .replace(/[“”"«»¿?¡!.,;:…—–]/g, ' ').replace(/\s+/g, ' ').trim();
  const stripArt = s => s.replace(/^(o|a|os|as|um|uma|uns|umas|the|a|an|to)\s+/, '');
  const ptMap = new Map(), enMap = new Map();
  for (const c of (typeof cards !== 'undefined' ? cards : [])) {
    const p = norm(c.pt), e = norm(c.en);
    for (const k of new Set([p, stripArt(p)])) if (k && !ptMap.has(k)) ptMap.set(k, c.en.replace(/\s*\([^)]*\)\s*$/, ''));
    for (const k of new Set([e, stripArt(e)])) if (k && !enMap.has(k)) enMap.set(k, c.pt.replace(/^[^:]{1,20}:\s+/, ''));
  }

  // ---- speech: Microsoft Raquel recordings ----
  // 1) text equals a whole card -> that card's recording
  // 2) single word -> audio/w/<hex>.mp3, pre-recorded by _tools/make_words.py (same file-name rule)
  // 3) phrase -> Raquel voice if the browser has it (Microsoft Edge), else the word recordings one after another
  // anything missing -> the device's own pt-PT voice
  const cardAudio = new Map();
  for (const c of (typeof cards !== 'undefined' ? cards : [])) { const k = norm(c.pt); if (k && c.a && !cardAudio.has(k)) cardAudio.set(k, c.a); }
  const toks = t => t.normalize('NFC').toLowerCase().replace(/\([^)]*\)/g, ' ').match(/\p{L}+(?:-\p{L}+)*/gu) || [];
  const wordFile = w => 'audio/w/' + [...new TextEncoder().encode(w.normalize('NFC').toLowerCase())].map(b => b.toString(16).padStart(2, '0')).join('') + '.mp3';
  const wa = new Audio();
  let voice = null, raquel = null, queue = [];
  function pickVoice() {
    const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    raquel = vs.find(v => /raquel/i.test(v.name) && /^pt/i.test(v.lang)) || null;
    voice = raquel || vs.find(v => /pt[-_]PT/i.test(v.lang) && /joana|catarina/i.test(v.name))
         || vs.find(v => /pt[-_]PT/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', pickVoice); }
  function systemSay(text) {
    queue = []; wa.pause();
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-PT'; if (voice) u.voice = voice; u.rate = 0.9;
    speechSynthesis.speak(u);
  }
  function playList(files, text) {
    queue = files.slice();
    const next = () => {
      if (!queue.length) return;
      wa.src = queue.shift();
      wa.play().catch(() => systemSay(text));
    };
    wa.onended = () => setTimeout(next, 60);
    wa.onerror = () => systemSay(text);
    next();
  }
  function speak(text) {
    if (!text) return;
    try { if (typeof audio !== 'undefined') audio.pause(); } catch (e) {}
    if (window.speechSynthesis) speechSynthesis.cancel();
    wa.pause();
    const card = cardAudio.get(norm(text));
    if (card) return playList([card], text);
    const ws = toks(text);
    if (ws.length === 1) return playList([wordFile(ws[0])], text);
    if (raquel || ws.length === 0 || ws.length > 8) return systemSay(text);
    playList(ws.map(wordFile), text);
  }

  // ---- translation: deck glossary first, then MyMemory ----
  async function translate(text, from) {
    const k = norm(text), map = from === 'pt' ? ptMap : enMap;
    const hit = map.get(k) || map.get(stripArt(k));
    if (hit) return { t: hit, src: 'this deck' };
    const key = from + '|' + k;
    if (cache.has(key)) return cache.get(key);
    const pair = from === 'pt' ? 'pt-PT|en-GB' : 'en-GB|pt-PT';
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + pair);
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if (!t || j.responseStatus != 200) throw new Error('no result');
    const res = { t, src: 'machine translation' };
    cache.set(key, res);
    return res;
  }

  function hide() { pop.style.display = 'none'; current = null; }
  function place(rect) {
    pop.style.display = 'block';
    const w = pop.offsetWidth, h = pop.offsetHeight, m = 12;
    const touch = matchMedia('(hover: none)').matches;   // iOS puts its own menu above the selection
    let top = touch ? rect.bottom + 14 : rect.top - h - 10;
    if (top < m) top = rect.bottom + 10;
    if (top + h > innerHeight - m) top = Math.max(m, rect.top - h - 10);
    let left = rect.left + rect.width / 2 - w / 2;
    left = Math.min(Math.max(m, left), innerWidth - w - m);
    pop.style.top = top + 'px'; pop.style.left = left + 'px';
  }

  async function show() {
    const sel = window.getSelection();
    const text = String(sel || '').replace(/\s+/g, ' ').trim();
    if (!text || !sel.rangeCount || text.length > 120) { hide(); return; }
    const range = sel.getRangeAt(0);
    let node = range.commonAncestorContainer; if (node.nodeType !== 1) node = node.parentElement;
    const term = node && node.closest('.card .term, .card .speaker');
    if (!term) { hide(); return; }
    const label = term.closest('.face').querySelector('.side-label');
    const from = /portugu/i.test(label ? label.textContent : '') ? 'pt' : 'en';
    if (current && current.text === text) { place(range.getBoundingClientRect()); return; }
    const id = ++reqId;
    current = { text, from, pt: from === 'pt' ? text : '' };
    $('.wp-text').textContent = text;
    $('.wp-tr').textContent = '…';
    const gt = `https://translate.google.com/?sl=${from === 'pt' ? 'pt' : 'en'}&tl=${from === 'pt' ? 'en' : 'pt'}&text=${encodeURIComponent(text)}`;
    // DeepL: the ?r= value makes every click a real page load (a hash-only change would not refresh the reused tab)
    const dl = `https://www.deepl.com/en/translator?r=${Date.now()}#${from === 'pt' ? 'pt/en-gb' : 'en/pt-pt'}/${encodeURIComponent(text)}`;
    const cam = `https://dictionary.cambridge.org/search/direct/?datasetsearch=${from === 'pt' ? 'portuguese-english' : 'english-portuguese'}&q=${encodeURIComponent(text)}`;
    // links open in one named tab per site (pfc-google / pfc-deepl / pfc-cambridge / pfc-reverso), reused on later clicks
  // Reverso conjugation (Russian UI) for a single Portuguese word; clitics like chamo-me -> chamo
    const verb = w => { const t = toks(w || ''); return t.length === 1 ? t[0].replace(/-(me|te|se|nos|vos|lhe|lhes|o|a|os|as|lo|la|los|las|no|na|nos|nas)$/, '') : ''; };
    const rv = w => w ? `<br><a href="https://glagol.reverso.net/${encodeURIComponent('спряжение-португальский-глагол-' + w)}.html" target="pfc-reverso">Reverso conjugation ↗</a>` : '';
    let links = `<a href="${gt}" target="pfc-google">Google Translate ↗</a> · <a href="${dl}" target="pfc-deepl">DeepL ↗</a><br><a href="${cam}" target="pfc-cambridge">Cambridge Dictionary ↗</a>`;
    const base = links;
    links = base + rv(from === 'pt' ? verb(text) : '');
    $('.wp-src').innerHTML = '';
    $('.wp-say').style.display = from === 'pt' ? '' : 'none';
    place(range.getBoundingClientRect());
    try {
      const r = await translate(text, from);
      if (id !== reqId) return;
      $('.wp-tr').textContent = r.t;
      if (from === 'en') { current.pt = r.t; $('.wp-say').style.display = ''; links = base + rv(verb(r.t)); }
      $('.wp-src').innerHTML = `${r.src} · ${links}`;
    } catch (e) {
      if (id !== reqId) return;
      $('.wp-tr').textContent = navigator.onLine === false ? 'Offline: no translation' : 'No translation found';
      $('.wp-src').innerHTML = links;
    }
    place(range.getBoundingClientRect());
  }

  // keep the selection when pressing the popup's buttons
  pop.addEventListener('mousedown', e => { if (!e.target.closest('a')) e.preventDefault(); });
  pop.addEventListener('click', e => e.stopPropagation());
  // Reuse one tab per dictionary. Keep the window handle too: some sites (Google Translate) drop the tab's
  // name, so a target="name" link alone would open a new tab every time.
  const wins = {};
  pop.addEventListener('click', e => {
    const a = e.target.closest('a[target^="pfc-"]'); if (!a) return;
    e.preventDefault();
    const w = wins[a.target];
    if (w && !w.closed) { try { w.location.href = a.href; w.focus(); return; } catch (x) {} }
    wins[a.target] = window.open(a.href, a.target) || wins[a.target];
  });
  $('.wp-say').addEventListener('click', () => current && speak(current.pt));
  document.addEventListener('selectionchange', () => { clearTimeout(timer); timer = setTimeout(show, 280); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { hide(); window.getSelection().removeAllRanges(); } });
  addEventListener('scroll', () => { if (current) show(); }, { passive: true });
  addEventListener('resize', () => { if (current) show(); });
})();
</script>
