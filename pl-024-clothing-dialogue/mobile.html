const cards = [{"s": "Key words", "pt": "a empregada", "en": "shop assistant (female)", "a": "audio/pl024-001-a-empregada.mp3"}, {"s": "Key words", "pt": "o cliente", "en": "customer", "a": "audio/pl024-002-o-cliente.mp3"}, {"s": "Key words", "pt": "o casaco", "en": "coat / jacket", "a": "audio/pl024-003-o-casaco.mp3"}, {"s": "Key words", "pt": "o casaco de pele", "en": "leather coat", "a": "audio/pl024-004-o-casaco-de-pele.mp3"}, {"s": "Key words", "pt": "o casaco de lã", "en": "wool coat (cardigan)", "a": "audio/pl024-005-o-casaco-de-la.mp3"}, {"s": "Key words", "pt": "o casaco de algodão", "en": "cotton coat", "a": "audio/pl024-006-o-casaco-de-algodao.mp3"}, {"s": "Key words", "pt": "o casaco de seda", "en": "silk coat", "a": "audio/pl024-007-o-casaco-de-seda.mp3"}, {"s": "Key words", "pt": "escuro", "en": "dark", "a": "audio/pl024-008-escuro.mp3"}, {"s": "Key words", "pt": "claro", "en": "light", "a": "audio/pl024-009-claro.mp3"}, {"s": "Key words", "pt": "castanho", "en": "brown", "a": "audio/pl024-010-castanho.mp3"}, {"s": "Key words", "pt": "preto", "en": "black", "a": "audio/pl024-011-preto.mp3"}, {"s": "Key words", "pt": "a cabine de prova", "en": "fitting room", "a": "audio/pl024-012-a-cabine-de-prova.mp3"}, {"s": "Key words", "pt": "em promoção", "en": "on sale", "a": "audio/pl024-013-em-promocao.mp3"}, {"s": "Key words", "pt": "estar na moda", "en": "to be in fashion", "a": "audio/pl024-014-estar-na-moda.mp3"}, {"s": "Key words", "pt": "a caixa", "en": "cash register", "a": "audio/pl024-015-a-caixa.mp3"}, {"s": "Dialogue", "pt": "Empregada: Bom dia, posso ajudá-lo?", "en": "Good morning, can I help you?", "a": "audio/pl024-016-empregada-bom-dia-posso-ajuda-lo.mp3"}, {"s": "Dialogue", "pt": "Cliente: Bom dia. Sim, queria um casaco, por favor.", "en": "Good morning. Yes, I would like a coat, please.", "a": "audio/pl024-017-bom-dia-sim-queria-um-casaco-por-favor.mp3"}, {"s": "Dialogue", "pt": "Empregada: Um casaco? Muito bem. De que tamanho?", "en": "A coat? Very well. Which size?", "a": "audio/pl024-018-empregada-um-casaco-muito-bem-de-que-tamanho.mp3"}, {"s": "Dialogue", "pt": "Cliente: Hmm... o casaco é para mim, portanto, em tamanho 38.", "en": "The coat is for me, so, size 38.", "a": "audio/pl024-019-hmm-o-casaco-e-para-mim-portanto-em-tamanho-38.mp3"}, {"s": "Dialogue", "pt": "Empregada: E de que cor?", "en": "And which colour?", "a": "audio/pl024-020-empregada-e-de-que-cor.mp3"}, {"s": "Dialogue", "pt": "Cliente: A cor? É indiferente. Talvez castanho ou preto. Uma cor escura.", "en": "The colour? I don't mind. Maybe brown or black. A dark colour.", "a": "audio/pl024-021-a-cor-e-indiferente-talvez-castanho-ou-preto-uma-c.mp3"}, {"s": "Dialogue", "pt": "Empregada: Olhe, temos este casaco castanho em pele, no número 38.", "en": "Look, we have this brown coat in leather, size 38.", "a": "audio/pl024-022-empregada-olhe-temos-este-casaco-castanho-em-pele-.mp3"}, {"s": "Dialogue", "pt": "Cliente: Um casaco de pele? É muito bonito, mas... quanto custa?", "en": "A leather coat? It's very nice, but... how much does it cost?", "a": "audio/pl024-023-um-casaco-de-pele-e-muito-bonito-mas-quanto-custa.mp3"}, {"s": "Dialogue", "pt": "Empregada: Este casaco custa 150 euros.", "en": "This coat costs 150 euros.", "a": "audio/pl024-024-empregada-este-casaco-custa-150-euros.mp3"}, {"s": "Dialogue", "pt": "Cliente: Ui, é muito caro. E um casaco de lã?", "en": "Oh, it's very expensive. And what about a wool coat (cardigan)?", "a": "audio/pl024-025-ui-e-muito-caro-e-um-casaco-de-la.mp3"}, {"s": "Dialogue", "pt": "Empregada: Deixe ver... Temos vários. Temos este casaco amarelo e este branco.", "en": "Let me see... We have several. We have this yellow one and this white one.", "a": "audio/pl024-026-empregada-deixe-ver-temos-varios-temos-este-casaco.mp3"}, {"s": "Dialogue", "pt": "Cliente: Amarelo e branco? Eu queria um casaco escuro, não queria um casaco claro.", "en": "Yellow and white? I wanted a dark coat, not a light coat.", "a": "audio/pl024-027-amarelo-e-branco-eu-queria-um-casaco-escuro-nao-qu.mp3"}, {"s": "Dialogue", "pt": "Empregada: Bom, temos este casaco castanho de lã, mas é muito grande. É o número 42.", "en": "Well, we have this brown wool coat, but it's very big. It's size 42.", "a": "audio/pl024-028-empregada-bom-temos-este-casaco-castanho-de-la-mas.mp3"}, {"s": "Dialogue", "pt": "Cliente: Não gosto muito, é muito comprido.", "en": "I don't like it very much, it's too long.", "a": "audio/pl024-029-nao-gosto-muito-e-muito-comprido.mp3"}, {"s": "Dialogue", "pt": "Empregada: Não quer experimentar na mesma?", "en": "Don't you want to try it anyway?", "a": "audio/pl024-030-empregada-nao-quer-experimentar-na-mesma.mp3"}, {"s": "Dialogue", "pt": "Cliente: Não, não vale a pena. E um casaco de algodão, tem?", "en": "No, it's not worth it. And a cotton coat, do you have any?", "a": "audio/pl024-031-nao-nao-vale-a-pena-e-um-casaco-de-algodao-tem.mp3"}, {"s": "Dialogue", "pt": "Empregada: Sim, este azul escuro e este azul claro.", "en": "Yes, this dark blue one and this light blue one.", "a": "audio/pl024-032-empregada-sim-este-azul-escuro-e-este-azul-claro.mp3"}, {"s": "Dialogue", "pt": "Cliente: Hmm, este escuro é bonito. Queria experimentar este, por favor.", "en": "Hmm, this dark one is nice. I would like to try this one, please.", "a": "audio/pl024-033-hmm-este-escuro-e-bonito-queria-experimentar-este-.mp3"}, {"s": "Dialogue", "pt": "Empregada: Claro! A cabine de prova é ali.", "en": "Sure! The fitting room is over there.", "a": "audio/pl024-034-empregada-claro-a-cabine-de-prova-e-ali.mp3"}, {"s": "Dialogue", "pt": "Empregada: Então, como fica?", "en": "So, how does it look?", "a": "audio/pl024-035-empregada-entao-como-fica.mp3"}, {"s": "Dialogue", "pt": "Cliente: Não fica bem. É muito grande e muito comprido!", "en": "It doesn't look good. It's too big and too long!", "a": "audio/pl024-036-nao-fica-bem-e-muito-grande-e-muito-comprido.mp3"}, {"s": "Dialogue", "pt": "Empregada: Ah desculpe   function pickVoice() {
    const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    raquel = vs.find(v => /raquel/i.test(v.name) && /^pt/i.test(v.lang)) || null;
    voice = raquel || vs.find(v => /pt[-_]PT/i.test(v.lang) && /joana|catarina/i.test(v.name))
         || vs.find(v => /pt[-_]PT/i.test(v.lang)) || vs.find(v => /^pt/i.test(v.lang)) || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.addEventListener && speechSynthesis.addEventListener('voiceschanged', pickVoice); }
  function systemSay(text) {
    queue = []; wa.pause();
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'pt-PT'; if (voice) u.voice = voice; u.rate = 0.9;
    speechSynthesis.speak(u);
  }
  function playList(files, text) {
    queue = files.slice();
    const next = () => {
      if (!queue.length) return;
      wa.src = queue.shift();
      wa.play().catch(() => systemSay(text));
    };
    wa.onended = () => setTimeout(next, 60);
    wa.onerror = () => systemSay(text);
    next();
  }
  function speak(text) {
    if (!text) return;
    try { if (typeof audio !== 'undefined') audio.pause(); } catch (e) {}
    if (window.speechSynthesis) speechSynthesis.cancel();
    wa.pause();
    const card = cardAudio.get(norm(text));
    if (card) return playList([card], text);
    const ws = toks(text);
    if (ws.length === 1) return playList([wordFile(ws[0])], text);
    if (raquel || ws.length === 0 || ws.length > 8) return systemSay(text);
    playList(ws.map(wordFile), text);
  }

  // ---- translation: Google Translate first, then the deck glossary, then MyMemory ----
  // translate.googleapis.com (client=gtx) is Google's free endpoint: no key, allows calls from web pages
  async function google(text, from) {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' + (from === 'pt' ? 'pt' : 'en')
      + '&tl=' + (from === 'pt' ? 'en' : 'pt-PT') + '&q=' + encodeURIComponent(text));
    const j = await r.json();
    const t = j && j[0] && j[0].map(x => x[0]).join('');
    if (!r.ok || !t) throw new Error('no result');
    return t;
  }
  async function translate(text, from) {
    const k = norm(text), map = from === 'pt' ? ptMap : enMap;
    const key = from + '|' + k;
    if (cache.has(key)) return cache.get(key);
    try { const res = { t: await google(text, from), src: 'Google Translate' }; cache.set(key, res); return res; } catch (e) {}
    const hit = map.get(k) || map.get(stripArt(k));
    if (hit) return { t: hit, src: 'this deck' };
    const pair = from === 'pt' ? 'pt-PT|en-GB' : 'en-GB|pt-PT';
    const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + pair);
    const j = await r.json();
    const t = j && j.responseData && j.responseData.translatedText;
    if (!t || j.responseStatus != 200) throw new Error('no result');
    const res = { t, src: 'machine translation' };
    cache.set(key, res);
    return res;
  }

  function hide() { pop.style.display = 'none'; current = null; }
  function place(rect) {
    pop.style.display = 'block';
    const w = pop.offsetWidth, h = pop.offsetHeight, m = 12;
    const touch = matchMedia('(hover: none)').matches;   // iOS puts its own menu above the selection
    let top = touch ? rect.bottom + 14 : rect.top - h - 10;
    if (top < m) top = rect.bottom + 10;
    if (top + h > innerHeight - m) top = Math.max(m, rect.top - h - 10);
    let left = rect.left + rect.width / 2 - w / 2;
    left = Math.min(Math.max(m, left), innerWidth - w - m);
    pop.style.top = top + 'px'; pop.style.left = left + 'px';
  }

  async function show() {
    const sel = window.getSelection();
    const text = String(sel || '').replace(/\s+/g, ' ').trim();
    if (!text || !sel.rangeCount || text.length > 120) { hide(); return; }
    const range = sel.getRangeAt(0);
    let node = range.commonAncestorContainer; if (node.nodeType !== 1) node = node.parentElement;
    const term = node && node.closest('.card .term, .card .speaker');
    if (!term) { hide(); return; }
    const label = term.closest('.face').querySelector('.side-label');
    const from = /portugu/i.test(label ? label.textContent : '') ? 'pt' : 'en';
    if (current && current.text === text) { place(range.getBoundingClientRect()); return; }
    const id = ++reqId;
    current = { text, from, pt: from === 'pt' ? text : '' };
    $('.wp-text').textContent = text;
    $('.wp-tr').textContent = '…';
    const gt = `https://translate.google.com/?sl=${from === 'pt' ? 'pt' : 'en'}&tl=${from === 'pt' ? 'en' : 'pt'}&text=${encodeURIComponent(text)}`;
    // DeepL: the ?r= value makes every click a real page load (a hash-only change would not refresh the reused tab)
    const dl = `https://www.deepl.com/en/translator?r=${Date.now()}#${from === 'pt' ? 'pt/en-gb' : 'en/pt-pt'}/${encodeURIComponent(text)}`;
    const cam = `https://dictionary.cambridge.org/search/direct/?datasetsearch=${from === 'pt' ? 'portuguese-english' : 'english-portuguese'}&q=${encodeURIComponent(text)}`;
    // links open in one named tab per site (pfc-google / pfc-deepl / pfc-cambridge / pfc-reverso), reused on later clicks
  // Reverso conjugation (Russian UI) for a single Portuguese word; clitics like chamo-me -> chamo
    const verb = w => { const t = toks(w || ''); return t.length === 1 ? t[0].replace(/-(me|te|se|nos|vos|lhe|lhes|o|a|os|as|lo|la|los|las|no|na|nos|nas)$/, '') : ''; };
    const rv = w => w ? `<a href="https://glagol.reverso.net/${encodeURIComponent('спряжение-португальский-глагол-' + w)}.html" target="pfc-reverso">Reverso conjugation ↗</a>` : '';
    let links = `<a href="${gt}" target="pfc-google">Google Translate ↗</a><a href="${dl}" target="pfc-deepl">DeepL ↗</a><a href="${cam}" target="pfc-cambridge">Cambridge Dictionary ↗</a>`;
    const base = links;
    links = base + rv(from === 'pt' ? verb(text) : '');
    $('.wp-src').innerHTML = '';
    $('.wp-say').style.display = from === 'pt' ? '' : 'none';
    place(range.getBoundingClientRect());
    try {
      const r = await translate(text, from);
      if (id !== reqId) return;
      $('.wp-tr').textContent = r.t;
      if (from === 'en') { current.pt = r.t; $('.wp-say').style.display = ''; links = base + rv(verb(r.t)); }
      $('.wp-src').innerHTML = `${r.src}${links}`;
    } catch (e) {
      if (id !== reqId) return;
      $('.wp-tr').textContent = navigator.onLine === false ? 'Offline: no translation' : 'No translation found';
      $('.wp-src').innerHTML = links;
    }
    place(range.getBoundingClientRect());
  }

  // keep the selection when pressing the popup's buttons
  pop.addEventListener('mousedown', e => { if (!e.target.closest('a')) e.preventDefault(); });
  pop.addEventListener('click', e => e.stopPropagation());
  // Reuse one tab per dictionary. Keep the window handle too: some sites (Google Translate) drop the tab's
  // name, so a target="name" link alone would open a new tab every time.
  const wins = {};
  pop.addEventListener('click', e => {
    const a = e.target.closest('a[target^="pfc-"]'); if (!a) return;
    e.preventDefault();
    const w = wins[a.target];
    if (w && !w.closed) { try { w.location.href = a.href; w.focus(); return; } catch (x) {} }
    wins[a.target] = window.open(a.href, a.target) || wins[a.target];
  });
  $('.wp-say').addEventListener('click', () => current && speak(current.pt));
  document.addEventListener('selectionchange', () => { clearTimeout(timer); timer = setTimeout(show, 280); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { hide(); window.getSelection().removeAllRanges(); } });
  addEventListener('scroll', () => { if (current) show(); }, { passive: true });
  addEventListener('resize', () => { if (current) show(); });
})();
</script>

</body>
