const cards = [{"s": "Text 1: eu", "pt": "Eu chamo-me Joana Fernandes.", "en": "My name is Joana Fernandes.", "a": "audio/pl026-001-eu-chamo-me-joana-fernandes.mp3"}, {"s": "Text 1: eu", "pt": "Joana é o meu primeiro nome.", "en": "Joana is my first name.", "a": "audio/pl026-002-joana-e-o-meu-primeiro-nome.mp3"}, {"s": "Text 1: eu", "pt": "Fernandes é o meu sobrenome.", "en": "Fernandes is my family name.", "a": "audio/pl026-003-fernandes-e-o-meu-sobrenome.mp3"}, {"s": "Text 1: eu", "pt": "Tenho vinte e nove anos e sou casada.", "en": "I am 29 and I am married.", "a": "audio/pl026-004-tenho-vinte-e-nove-anos-e-sou-casada.mp3"}, {"s": "Text 1: eu", "pt": "Tenho um filho com dois anos.", "en": "I have a 2-year-old son.", "a": "audio/pl026-005-tenho-um-filho-com-dois-anos.mp3"}, {"s": "Text 1: eu", "pt": "Moro no Porto perto do centro da cidade.", "en": "I live in Porto near the city centre.", "a": "audio/pl026-006-moro-no-porto-perto-do-centro-da-cidade.mp3"}, {"s": "Text 1: eu", "pt": "Eu trabalho como engenheira numa empresa de arquitetura.", "en": "I work as an engineer in an architecture firm.", "a": "audio/pl026-007-eu-trabalho-como-engenheira-numa-empresa-de-arquit.mp3"}, {"s": "Text 1: eu", "pt": "Eu sou uma pessoa muito ocupada, mas nos meus tempos-livres gosto de passear na praia com a minha família.", "en": "I am a very busy person, but in my free time I like to walk on the beach with my family.", "a": "audio/pl026-008-eu-sou-uma-pessoa-muito-ocupada-mas-nos-meus-tempo.mp3"}, {"s": "Text 1: eu", "pt": "Também pratico natação com o meu filho à quarta-feira.", "en": "I also go swimming with my son on Wednesdays.", "a": "audio/pl026-009-tambem-pratico-natacao-com-o-meu-filho-a-quarta-fe.mp3"}, {"s": "Text 1: eu", "pt": "No fim-de-semana, quando tenho tempo, vou ao cinema com o meu marido.", "en": "At the weekend, when I have time, I go to the cinema with my husband.", "a": "audio/pl026-010-no-fim-de-semana-quando-tenho-tempo-vou-ao-cinema-.mp3"}, {"s": "Text 1: eu", "pt": "Durante a semana saio de casa às nove da manhã e vou de carro para o trabalho.", "en": "During the week I leave home at 9 in the morning and drive to work.", "a": "audio/pl026-011-durante-a-semana-saio-de-casa-as-nove-da-manha-e-v.mp3"}, {"s": "Text 1: eu", "pt": "Ouço as notícias no carro e chego ao escritório às nove e meia.", "en": "I listen to the news in the car and I arrive at the office at 9:30.", "a": "audio/pl026-012-ouco-as-noticias-no-carro-e-chego-ao-escritorio-as.mp3"}, {"s": "Text 1: eu", "pt": "À hora de almoço, almoço fora com os meus colegas.", "en": "At lunchtime, I eat out with my colleagues.", "a": "audio/pl026-013-a-hora-de-almoco-almoco-fora-com-os-meus-colegas.mp3"}, {"s": "Text 1: eu", "pt": "Da parte da tarde trabalho até às seis e meia.", "en": "In the afternoon I work until 6:30.", "a": "audio/pl026-014-da-parte-da-tarde-trabalho-ate-as-seis-e-meia.mp3"}, {"s": "Text 1: eu", "pt": "Vou buscar o meu filho ao infantário e vou para casa.", "en": "I pick up my son from nursery school and I go home.", "a": "audio/pl026-015-vou-buscar-o-meu-filho-ao-infantario-e-vou-para-ca.mp3"}, {"s": "Text 1: eu", "pt": "Depois de jantar ainda leio um pouco e finalmente adormeço.", "en": "After dinner I still read a little and finally I fall asleep.", "a": "audio/pl026-016-depois-de-jantar-ainda-leio-um-pouco-e-finalmente-.mp3"}, {"s": "Text 2: tu", "pt": "Tu chamas-te Rui.", "en": "Your name is Rui.", "a": "audio/pl026-017-tu-chamas-te-rui.mp3"}, {"s": "Text 2: tu", "pt": "O teu sobrenome é Rodrigues.", "en": "Your family name is Rodrigues.", "a": "audio/pl026-018-o-teu-sobrenome-e-rodrigues.mp3"}, {"s": "Text 2: tu", "pt": "Tens treze anos.", "en": "You are 13 years old.", "a": "audio/pl026-019-tens-treze-anos.mp3"}, {"s": "Text 2: tu", "pt": "Tu tens uma família muito grande, tens três irmãos e quatro primos.", "en": "You have a very big family, you have 3 brothers (or siblings) and 4 cousins.", "a": "audio/pl026-020-tu-tens-uma-familia-muito-grande-tens-tres-irmaos-.mp3"}, {"s": "Text 2: tu", "pt": "Tu vives com os teus pais e os teus irmãos em Évora.", "en": "You live with your parents and your brothers in Évora.", "a": "audio/pl026-021-tu-vives-com-os-teus-pais-e-os-teus-irmaos-em-evor.mp3"}, {"s": "Text 2: tu", "pt": "Ainda andas na escola e gostas de estudar matemática.", "en": "You are still at school and you like studying maths.", "a": "audio/pl026-022-ainda-andas-na-escola-e-gostas-de-estudar-matemati.mp3"}, {"s": "Text 2: tu", "pt": "Quando chegas da escola fazes os trabalhos de casa e depois jogas à bola no jardim da tua casa.", "en": "When you get home from school you do your homework and then you play football in the garden of your house.", "a": "audio/pl026-023-quando-chegas-da-escola-fazes-os-trabalhos-de-casa.mp3"}, {"s": "Text 2: tu", "pt": "Tens um cão e também brincas muito com ele.", "en": "You have a dog and you also play with him a lot.", "a": "audio/pl026-024-tens-um-cao-e-tambem-brincas-muito-com-ele.mp3"}, {"s": "Text 2: tu", "pt": "Quando o tempo está bom, durante o fim-de-semana, vais à piscina com os teus amigos e comes um gelado ou dois.", "en": "When the weather is good, at the weekend, you go to the pool with your friends and you eat an ice cream or two.", "a": "audio/pl026-025-quando-o-tempo-esta-bom-durante-o-fim-de-semana-va.mp3"}, {"s": "Text 2: tu", "pt": "Almoças sempre com a família toda e fazes grandes caminhadas no campo com eles.", "en": "You always have lunch with the whole family and you go on long walks in the countryside with them.", "a": "audio/pl026-026-almocas-sempre-com-a-familia-toda-e-fazes-grandes-.mp3"}, {"s": "Text 2: tu", "pt": "Quando vês um cavalo tiras sempre uma fotografia.", "en": "When you see a horse you always take a photo.", "a": "audio/pl026-027-quando-ves-um-cavalo-tiras-sempre-uma-fotografia.mp3"}, {"s": "Text 3: ele", "pt": "O Alexandre é um homem de negócios.", "en": "Alexandre is a businessman.", "a": "audio/pl026-028-o-alexandre-e-um-homem-de-negocios.mp3"}, {"s": "Text 3: ele", "pt": "Vive sozinho num apartamento em Lisboa e tem trinta e dois anos.", "en": "He lives alone in an apartment in Lisbon and he is 32 years old.", "a": "audio/pl026-029-vive-sozinho-num-apartamento-em-lisboa-e-tem-trint.mp3"}, {"s": "Text 3: ele", "pt": "Ele tem uma empresa de informática e viaja muitas vezes para o estrangeiro.", "en": "He has an IT company and he often travels abroad.", "a": "audio/pl026-030-ele-tem-uma-empresa-de-informatica-e-viaja-muitas-.mp3"}, {"s": "Text 3: ele", "pt": "Todos os meses apanha o avião no aeroporto de Lisboa e voa até Madrid e Barcelona.", "en": "Every month he catches a plane at Lisbon airport and flies to Madrid and Barcelona.", "a": "audio/pl026-031-todos-os-meses-apanha-o-aviao-no-aeroporto-de-lisb.mp3"}, {"s": "Text 3: ele", "pt": "Ele veste fatos caros e tem sempre um carro novo.", "en": "He wears expensive suits and always has a new car.", "a": "audio/pl026-032-ele-veste-fatos-caros-e-tem-sempre-um-carro-novo.mp3"}, {"s": "Text 3: ele", "pt": "Usa muitas vezes óculos escuros, mesmo quando não está sol.", "en": "He often wears sunglasses, even when it is not sunny.", "a": "audio/pl026-033-usa-muitas-vezes-oculos-escuros-mesmo-quando-nao-e.mp3"}, {"s": "Text 3: ele", "pt": "O Alexandre não tem tempo livre, mas gosta de praticar desporto uma vez por semana no ginásio perto de sua casa.", "en": "Alexandre doesn't have any free time, but he likes to do sport once a week at the gym near his home.", "a": "audio/pl026-034-o-alexandre-nao-tem-tempo-livre-mas-gosta-de-prati.mp3"}, {"s": "Text 3: ele", "pt": "Também aprende Espanhol pela internet e fala frequentemente com amigos espanhóis.", "en": "He also learns Spanish online and often talks with Spanish friends.", "a": "audio/pl026-035-tambem-aprende-espanhol-pela-internet-e-fala-frequ.mp3"}, {"s": "Text 3: ele", "pt": "Quando está em Lisboa visita os pais ao fim-de-semana e ouve as novidades do resto da família.", "en": "When he is in Lisbon he visits his parents at the weekend and hears the news from the rest of the family.", "a": "audio/pl026-036-quando-esta-em-lisboa-visita-os-pais-ao-fim-de-sem.mp3"}];
const SPEAKER = /^(Cliente|Empregado|Empregada):\s*/;
const sections = [...new Set(cards.map(c => c.s))];
const DECK = 'pl-026-story-biographies';
const keyOf = i => cards[i].s + '|' + cards[i].pt;
let known = new Set();
const loadKnown = () => { known = new Set(cards.map((c, i) => i).filter(i => Sync.isKnown(DECK, keyOf(i)))); };
loadKnown();

let section = '', order = [], position = 0, flipped = false, reverse = false, autoplay = true;
const el = id => document.getElementById(id);
const main = document.querySelector('main');
const audio = new Audio(); audio.preload = 'auto';

function split(pt) { const m = pt.match(SPEAKER); return m ? [m[1], pt.slice(m[0].length)] : ['', pt]; }
function sizeClass(t) { return t.length > 60 ? 'term lg' : t.length > 20 ? 'term md' : 'term'; }

}

    el('chips').appendChild(b);
  }
}
function render(fresh, quiet) {

  el('bar').style.width = `${total ? (done / total) * 100 : 0}%`;
  main.classList.toggle('all-known', !order.length);
  main.classList.toggle('round-end', ended && !!order.length);

  const c = cards[order[position]], [who, pt] = split(c.pt);

  el('front-speaker').textContent = who; el('back-speaker').textContent = who;
  el('front-label').textContent = reverse ? 'English' : 'Português';
  el('back-label').textContent = reverse ? 'Português' : 'English';
  el('category').textContent = c.s; el('back-category').textContent = c.s;
  el('count').innerHTML = `${position + 1} / ${order.length}<br>Known ${done}/${total}`;

  if (!quiet && autoplay && ((fresh && !reverse) || (!fresh && flipped && reverse))) play();
}
function play() {
  if (!order.length || ended) return;

audio.onerror = () => { el('audio-status').textContent = 'Audio could not be loaded (check your connection).'; };
function know() {

  const next = position + by;
  if (next < 0) return;
  if (next >= order.length) { ended = true; render(true); return; }
  position = next; flipped = false; render(true);
}
function restartRound(shuffled) { ended = false; flipped = false; position = 0; roundSize = order.length; if (shuffled) shuffle(); else render(true); }
function shuffle() { if (!order.length) return; ended = false; roundSize = order.length; for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; } position = 0; flipped = false; render(true); }

// tap to flip, swipe left = next, swipe right = previous
let sx = 0, sy = 0, st = 0, swiped = false;
el('wrap').addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now(); swiped = false; }, { passive: true });
el('wrap').addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (!hasSel() && Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 800) {
    swiped = true;
    const card = el('card'); card.classList.remove('swipe-l', 'swipe-r'); void card.offsetWidth;
    card.classList.add(dx < 0 ? 'swipe-l' : 'swipe-r');
    setTimeout(() => card.classList.remove('swipe-l', 'swipe-r'), 200);
    move(dx < 0 ? 1 : -1);
  }
});
// flip only on a plain click/tap: not when selecting text (drag, double-click, long-press) or clearing a selection
const hasSel = () => String(window.getSelection ? getSelection() : '').trim() !== '';
let selAtDown = false, flipTimer = null;
el('card').addEventListener('pointerdown', () => { selAtDown = hasSel(); });
function cardClick(e) {
  clearTimeout(flipTimer);
  if (e.detail > 1 || selAtDown || hasSel()) return;
  // with a mouse, wait a moment so a double-click (word select) cancels the flip
  const wait = matchMedia('(hover: hover) and (pointer: fine)').matches ? 250 : 0;
  flipTimer = setTimeout(() => { if (!hasSel()) flip(); }, wait);
}
el('card').addEventListener('click', e => { if (swiped) { swiped = false; return; } if (e.target.closest('[data-say]')) return; cardClick(e); });
document.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); play(); }));
el('flip').addEventListener('click', flip);
el('prev').addEventListener('click', () => move(-1)); el('next').addEventListener('click', () => move(1));
el('know').addEventListener('click', know);
const resetKnown = () => { inSection().forEach(i => { known.delete(i); Sync.setKnown(DECK, keyOf(i), false); }); chips(); build(); };
el('reset').addEventListener('click', () => { if (confirm('Mark all cards in this section as not known?')) resetKnown(); });
el('restart').addEventListener('click', resetKnown);
el('shuffle').addEventListener('click', shuffle);
el('again').addEventListener('click', () => restartRound(false));
el('again-shuffle').addEventListener('click', () => restartRound(true));
el('back-last').addEventListener('click', () => { ended = false; position = order.length - 1; flipped = false; render(true); });
el('direction').addEventListener('click', () => { reverse = !reverse; el('direction').textContent = reverse ? 'Portuguese → English' : 'English → Portuguese'; flipped = false; render(true); });
el('autoplay').addEventListener('click', () => { autoplay = !autoplay; el('autoplay').textContent = `Auto-play: ${autoplay ? 'on' : 'off'}`; el('autoplay').setAttribute('aria-pressed', String(autoplay)); });
// iPad with keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.target.tagName === 'BUTTON' && e.code === 'Space') return;
  if (ended && (e.key === 'Enter' || e.code === 'Space')) { e.preventDefault(); restartRound(false); return; }
  if (e.code === 'Space') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (e.key.toLowerCase() === 'q') play();
  else if (e.key.toLowerCase() === 'k') know();
});

function syncRefresh() {
  const before = known; loadKnown();
  const wasEmpty = !order.length, current = order[position];
  order = order.filter(i => !known.has(i));
  const back = [...before].filter(i => !known.has(i) && (!section || cards[i].s === section));
  if (wasEmpty && back.length) { chips(); build(); return; }
  order.push(...back);
  const p = order.indexOf(current);
  if (p >= 0) position = p; else { position = Math.min(position, Math.max(order.length - 1, 0)); flipped = false; }
  chips(); render(false, true);
}
Sync.onChange(syncRefresh);
Sync.onStatus(t => { el('sync-btn').textContent = '☁︎ ' + t; });
el('sync-btn').addEventListener('click', () => Sync.openSettings());
chips(); build();
</script>
